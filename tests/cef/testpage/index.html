<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>omp-cef Android · stage 6</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    /* Key point: fullscreen transparent background — the game scene must show through */
    background: transparent;
    font: 15px/1.5 -apple-system, "Noto Sans SC", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .panel {
    position: absolute;
    left: 20px; top: 20px; right: 20px; bottom: 20px;
    border: 2px solid #38bdf8;
    border-radius: 14px;
    background: rgba(8, 20, 32, 0.86);
    color: #e8f2ff;
    display: flex; flex-direction: column;
    padding: 16px 20px;
    box-sizing: border-box;
  }
  .panel.flash { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,.45) inset; }
  h1 { margin: 0 0 2px; font-size: 18px; color: #38bdf8; font-weight: 700; letter-spacing: .4px; }
  .sub { color: #7c93a8; font-size: 12px; margin-bottom: 10px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; }
  .stat { padding: 3px 9px; border-radius: 6px; background: #10243a; border: 1px solid #21456b; color: #9dc4e6; }
  .stat b { color: #6ee7b7; font-weight: 600; }
  .stat.bad b { color: #fca5a5; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  button {
    font: inherit; font-size: 14px;
    padding: 8px 15px; border-radius: 9px;
    border: 1px solid #2f4a63; background: #16283a; color: #cfe6ff;
    cursor: pointer;
  }
  button:active { background: #1f3c56; }
  button.on { background: #0ea5e9; border-color: #38bdf8; color: #04121f; font-weight: 600; }
  /* Stage 6: IME input box. Made tall so it is easy to hit blind on a real device (a hit pops the keyboard). */
  .imebox { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .imebox label { color: #7c93a8; font-size: 12px; white-space: nowrap; }
  #tin {
    flex: 1; min-width: 0; height: 54px;
    font: inherit; font-size: 18px;
    padding: 0 12px; border-radius: 9px;
    border: 1px solid #2f4a63; background: #0b1a29; color: #e8f2ff;
    -webkit-user-select: text; user-select: text;
    box-sizing: border-box;
  }
  #tin:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 2px rgba(56,189,248,.25); }
  .log {
    flex: 1; overflow: auto;
    font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace;
    color: #8fd3ff; white-space: pre-wrap;
    border-top: 1px solid #1d3348; padding-top: 8px; margin-top: 2px;
  }
  .log .srv { color: #fbbf24; }
  .log .up  { color: #6ee7b7; }
  .log .ime { color: #f9a8d4; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <h1>omp-cef · Android · Stage 6 Input</h1>
  <div class="sub">Touch pass-through/takeover → IME Chinese input → hardware key uplink PressKey → chat state ChatInputState</div>

  <div class="stats">
    <div class="stat" id="st-cef">window.cef: <b id="v-cef">?</b></div>
    <div class="stat" id="st-down">Downlink events: <b id="v-down">0</b></div>
    <div class="stat" id="st-up">Uplink events: <b id="v-up">0</b></div>
    <div class="stat" id="st-early">Queued before first frame: <b id="v-early">Not received</b></div>
    <div class="stat" id="st-chat">Game chat: <b id="v-chat">Closed</b></div>
    <div class="stat" id="st-vp">Viewport: <b id="v-vp">?</b></div>
    <div class="stat" id="st-url">Source: <b id="v-url">?</b></div>
  </div>

  <div class="imebox">
    <label>IME input →</label>
    <input id="tin" type="text" placeholder="Tap here to pop the keyboard; typing uplinks test:input" autocomplete="off" spellcheck="false">
  </div>

  <div class="row">
    <button onclick="pick(this,'A',1)">A</button>
    <button onclick="pick(this,'B',2)">B</button>
    <button onclick="pick(this,'C',3)">C</button>
    <button onclick="cef.emit('test:noargs')">No args</button>
    <button onclick="cef.emit('test:nonScalar',{a:1},[1,2])">Non-scalar</button>
    <button onclick="blurInput()">Hide keyboard</button>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
  var logEl = document.getElementById('log');
  var down = 0, up = 0, seq = 0;

  function log(msg, cls) {
    seq++;
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = '[' + seq + '] ' + msg;
    logEl.insertBefore(line, logEl.firstChild);
  }
  function el(id) { return document.getElementById(id); }

  // ---- Stage 4 core: window.cef is injected inline by CefResourceProvider (ready before the document is parsed)
  if (window.cef) {
    el('v-cef').textContent = 'ready (' + (window.cef.__mark || '?') + ')';
    log('window.cef injected; page scripts can register callbacks directly', 'up');
  } else {
    el('v-cef').textContent = 'MISSING';
    el('st-cef').className = 'stat bad';
    log('window.cef not injected — Stage 4 failed');
  }

  function onServerEvent(name) {
    down++;
    el('v-down').textContent = down;
    return name;
  }

  if (window.cef) {
    // 1) The server sends this right after CreateBrowser, usually arriving before the page finishes loading,
    //    to verify the native/WebView-side queue-and-replay.
    cef.on('test:early', function (tag, n) {
      onServerEvent('test:early');
      el('v-early').textContent = String(tag);
      log('Received pre-first-frame event test:early: ' + tag + ' / ' + n + ' (' + typeof n + ')', 'srv');
      cef.emit('test:earlyAck', tag, n, true, 2.25);
      up++; el('v-up').textContent = up;
    });

    // 2) Four argument types: string / int / float / bool
    //    Note on integral values: in JS, 7.0 and 7 are the same number, and stock CEF's CefV8Value::IsInt()
    //    returns true for integral values, so integral values always go as Integer; only values that are genuinely fractional are
    //    Float. frac*2+0.5 is used here deliberately so the fractional part is non-zero.
    cef.on('test:hello', function (who, num, frac, flag) {
      onServerEvent('test:hello');
      log('Received test:hello: ' + who + ' int=' + num + '(' + typeof num + ')'
          + ' float=' + frac + '(' + typeof frac + ')'
          + ' bool=' + flag + '(' + typeof flag + ')', 'srv');
      cef.emit('test:ack',
        'ack:' + who + '🚀',
        num + 1,
        frac * 2 + 0.5,
        !flag);
      up++; el('v-up').textContent = up;
    });

    // 3) Command event: the server asks for a highlight, auto-restoring after 1.2s
    cef.on('test:command', function (cmd, ms) {
      onServerEvent('test:command');
      log('Received test:command: ' + cmd + ' (' + ms + 'ms)', 'srv');
      var p = el('panel');
      p.classList.add('flash');
      setTimeout(function () { p.classList.remove('flash'); }, ms || 1200);
      cef.emit('test:commandAck', cmd);
      up++; el('v-up').textContent = up;
    });

    // 4) cef.off semantics: registered then immediately removed, so later pings from the server must not fire it
    var pingCount = 0;
    function onPing() { pingCount++; }
    cef.on('test:ping', onPing);
    cef.off('test:ping', onPing);
    cef.on('test:ping', function () {
      onServerEvent('test:ping');
      log('test:ping arrived (old callback was removed via cef.off, pingCount=' + pingCount + ')', 'srv');
      cef.emit('test:pingAck', pingCount);
      up++; el('v-up').textContent = up;
    });

    // 5) Stage 6: client-internal event (the local branch of PC ChatHook::SetChatInputState).
    //    This is a one-way "client -> page" event; the page only reads it and never reports back.
    cef.on('omp:cef:internal:chatInputState', function (open) {
      el('v-chat').textContent = open ? 'Open' : 'Closed';
      el('st-chat').className = 'stat' + (open ? ' bad' : '');
      log('Internal event chatInputState open=' + open, 'srv');
    });
  }

  function pick(btn, name, index) {
    var all = document.querySelectorAll('button');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('on');
    btn.classList.add('on');
    if (!window.cef) { log('cef unavailable, taps cannot uplink'); return; }
    // One uplink verifies all four scalar types
    cef.emit('test:click', name, index, true, 1.5 + index / 10);
    up++; el('v-up').textContent = up;
    log('cef.emit test:click("' + name + '", ' + index + ', true, ' + (1.5 + index / 10) + ')', 'up');
  }

  // ---- Stage 6: IME. input events are submitted by the system IME; Chinese/emoji all go through the same path,
  //      and the server verifies the UTF-8 byte by byte after uplink.
  var tin = el('tin');
  var imeSeq = 0;
  tin.addEventListener('input', function () {
    if (!window.cef) return;
    imeSeq++;
    cef.emit('test:input', tin.value, tin.value.length);
    up++; el('v-up').textContent = up;
    log('IME input #' + imeSeq + ': "' + tin.value + '" (' + tin.value.length + ' chars)', 'ime');
  });
  tin.addEventListener('focus', function () { log('Input focused (Chromium requested the IME)', 'ime'); });
  tin.addEventListener('blur', function () { log('Input lost focus', 'ime'); });

  // ---- Stage 7: arbitrary landing-point probe.
  //     A World2D page is projected into a rectangle on screen; this proves that "a touch landing inside the projected rectangle really
  //     reaches the page" and "a touch outside the rectangle goes back to the game". It does not depend on the page layout, so it still works if the page is squashed.
  document.addEventListener('pointerdown', function (e) {
    if (!window.cef) return;
    var target = e.target && e.target.id ? e.target.id
        : (e.target && e.target.tagName ? e.target.tagName : '?');
    cef.emit('test:tap', String(target), Math.round(e.clientX), Math.round(e.clientY));
    up++; el('v-up').textContent = up;
    log('Landing point ' + target + ' @' + Math.round(e.clientX) + ',' + Math.round(e.clientY), 'ime');
  }, true);

  function blurInput() {
    tin.blur();
    if (window.cef) cef.emit('test:blur');
  }

  // ---- Stage 6: viewport probe.
  //     When the keyboard pops up, the WebView's *visible height* must really shrink, otherwise Chromium will not scroll the focused element into
  //     the visible area. If the client merely shifts the whole window (adjustPan), innerHeight stays the same and the lower half of the page
  //     is still covered. So innerHeight / visualViewport.height are uplinked here, and the server uses them to tell
  //     which one the client actually did — without relying on client logs.
  function reportViewport(tag) {
    var ih = Math.round(innerHeight);
    var vv = window.visualViewport ? Math.round(window.visualViewport.height) : 0;
    el('v-vp').textContent = ih + ' / ' + vv;
    if (!window.cef) return;
    cef.emit('test:viewport', String(tag), ih, vv, Math.round(screen.height));
    up++; el('v-up').textContent = up;
    log('Viewport ' + tag + ': innerHeight=' + ih + ' vv=' + vv, 'ime');
  }
  window.addEventListener('resize', function () { reportViewport('resize'); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { reportViewport('vv'); });
  }
  tin.addEventListener('focus', function () { setTimeout(function () { reportViewport('focus'); }, 350); });
  tin.addEventListener('blur', function () { setTimeout(function () { reportViewport('blur'); }, 350); });

  log('Page loaded · ' + innerWidth + 'x' + innerHeight + ' · dpr ' + (window.devicePixelRatio || 1));
  var origin = document.getElementById('v-url');
  if (origin) origin.textContent = location.pathname;
  if (window.cef) {
    // Layout may not be finished right after the WebView attaches, so innerWidth / innerHeight are briefly 0.
    // Reporting "ready" at that moment is meaningless (the server would take 0x0 as the viewport size, and the World2D
    // size assertion would then fail spuriously). Retry every 50ms until the size is valid, up to 1s; as a fallback still send
    // once, so probe:ready is never missing.
    var readyTries = 0;
    var emitReady = function () {
      var w = Math.round(innerWidth), h = Math.round(innerHeight);
      if ((w <= 0 || h <= 0) && readyTries < 20) {
        readyTries++;
        setTimeout(emitReady, 50);
        return;
      }
      cef.emit('probe:ready',
        document.title,
        w,
        h,
        window.devicePixelRatio || 1,
        navigator.userAgent.indexOf('; wv') >= 0);
      up++; el('v-up').textContent = up;
      log('Sent probe:ready ' + w + 'x' + h, 'up');
    };
    emitReady();
  }
</script>
</body>
</html>
